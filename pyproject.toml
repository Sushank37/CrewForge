[project]
name = "crewforge"
version = "0.1.0"
description = "Model-agnostic, self-assembling multi-agent intelligence network exposed through MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.30.0",
    "openai==2.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10.0.0",
    "pytest-asyncio>=0.25.3,<2.0.0",
    "ruff>=0.9.9,<1.0.0",
]

[project.scripts]
crewforge = "crewforge.cli:main"
crewforge-mcp = "crewforge.mcp_server:main"
crewforge-public-mcp = "crewforge.public_mcp_service:main"
crewforge-dashboard = "crewforge.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
